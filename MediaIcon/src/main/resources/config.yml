# Port pro stazeni packu (musi byt otevreny/povoleny na hostingu!)
http-port: 8765
# Hraci musi pack prijmout
force-pack: true
# pack_format: 22 = 1.20.3-1.20.4, 32 = 1.21, 34 = 1.21.2-1.21.3
pack-format: 22

